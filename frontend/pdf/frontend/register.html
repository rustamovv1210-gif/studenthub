<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ro‘yxatdan o‘tish | Student Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>Student Hub</h1>

    <nav>
        <a href="index.html">Bosh sahifa</a>
        <a href="subjects.html">Fanlar</a>
        <a href="tests.html">Testlar</a>
        <a href="schedule.html">Dars jadvali</a>
        <a href="materials.html">Materiallar</a>

        <button
            id="themeButton"
            class="theme-button"
            title="Dark / Light Mode"
        >
            🌙
        </button>

        <a
            href="login.html"
            class="account-link"
        >
            Kirish
        </a>
    </nav>

</header>


<main>

    <section class="login-section">

        <div class="login-box">

            <div class="login-icon">
                👤
            </div>

            <h2>Ro‘yxatdan o‘tish</h2>

            <p>
                Student Hub hisobingizni yarating
            </p>


            <label for="registerName">
                Ismingiz
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Ismingizni kiriting"
            >


            <label for="registerEmail">
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="example@gmail.com"
            >


            <label for="registerPassword">
                Parol
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Kamida 6 ta belgi"
            >


            <label for="confirmPassword">
                Parolni tasdiqlang
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Parolni qayta kiriting"
            >


            <button id="registerButton">
                Ro‘yxatdan o‘tish
            </button>


            <p id="registerMessage"></p>


            <div class="register-text">

                Hisobingiz bormi?

                <a href="login.html">
                    Kirish
                </a>

            </div>

        </div>

    </section>

</main>


<footer>
    <p>© 2026 Student Hub</p>
</footer>


<script src="register.js"></script>
<script src="navbar.js"></script>
<script src="theme.js"></script>

</body>

</html>
